<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arap Yemeği Bilme Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">
        <h1>Arap Yemeği Bilme Oyunu</h1>
        <div id="game-area">
            
            <div id="main-menu" class="screen active">
                <h2>ANA MENÜ</h2>
                <button onclick="showScreen('group-setup')">2 - Grup Oynama</button>
                <button onclick="showScreen('individual-start')">1 - Bireysel Oynama</button>
            </div>

            <div id="group-setup" class="screen">
                <h2>GRUP OYUNU KURULUMU</h2>

                <label for="player-count">Kaç kişi oynamak istersiniz?</label>
                <select id="player-count">
                    <option value="2">2 Kişi</option>
                    <option value="3">3 Kişi</option>
                    <option value="4">4 Kişi</option>
                </select>

                <label for="time-limit">Soru Başına Süre (saniye):</label>
                <select id="time-limit">
                    <option value="30">30 saniye</option>
                    <option value="60">60 saniye</option>
                    <option value="90">90 saniye</option>
                </select>
                
                <p class="rule">Kural: En çok doğru bilen taraf (grup) kazanır.</p>
                <button onclick="startGroupGame()">Oyunu Başlat</button>
                <button class="back-button" onclick="showScreen('main-menu')">Geri Dön</button>
            </div>

            <div id="game-screen" class="screen">
                <h2>OYUN BAŞLADI!</h2>
                <div id="game-details"></div>
                <div id="spin-result"></div>
                <button onclick="carkiDondur()">YENİ YEMEK SEÇ (ÇARKI DÖNDÜR)</button>
                <button class="back-button" onclick="showScreen('main-menu', true)">Ana Menüye Dön</button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
